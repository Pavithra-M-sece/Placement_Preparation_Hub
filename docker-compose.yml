version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: placementhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/placementhub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: your_password
      JWT_SECRET: your_256_bit_secret_key_here_replace_this_in_production
    depends_on:
      - db

volumes:
  pgdata:
